:root{color-scheme:light;--bg:#f3f5f9;--bg2:#ffffff;--gold:#d4af37;--tx:#1d2433;--mu:#6b7488;--ok:#1f9d63;--bad:#e5645a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.35 system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.f{font-family:'Playfair Display',Georgia,serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;color:var(--tx);background:#ffffff;border:1px solid #dde2ec;border-radius:8px;padding:8px;min-width:0;width:100%}
.btn{background:var(--gold);color:#1d1500;font-weight:700;padding:14px 22px;border-radius:12px}
.btn.g{background:var(--bg2);color:var(--tx);border:1px solid var(--gold)}
.btn.s{padding:8px 12px;font-size:14px}.btn.d{background:var(--bad);color:#fff}
.app{height:100%;display:flex;flex-direction:column}
.idle{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:20px;background:radial-gradient(circle at 50% 30%,#fff1c4,var(--bg) 70%)}
.idle h1{font-size:clamp(36px,9vw,84px);margin:0;color:var(--gold)}
.idle .row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}.idle .btn{font-size:22px;padding:22px 34px}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #dde2ec}
.top h2{margin:0;color:var(--gold);font-size:20px;flex:1}
.main{flex:1;min-height:0;display:grid;grid-template-columns:1fr}
.shop{display:flex;flex-direction:column;min-height:0}
.cats{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;flex:none}
.cat{flex:none;padding:10px 14px;border-radius:999px;border:1px solid #dde2ec;white-space:nowrap}
.cat.on{background:var(--gold);color:#1d1500;font-weight:700;border-color:var(--gold)}
.grid{flex:1;overflow-y:auto;padding:4px 12px 90px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;align-content:start}
.card{background:var(--bg2);border:1px solid #dde2ec;border-radius:14px;overflow:hidden;text-align:start;display:flex;flex-direction:column}
.card:active{border-color:var(--gold)}

 background:conic-gradient(from var(--ga),#0000 0 58%,#ffe08a 74%,#d4af37 88%,#0000 100%);

@keyframes brandIn{0%{opacity:0;transform:translateY(18px) scale(.9);letter-spacing:.3em}60%{opacity:1}100%{opacity:1;transform:none;letter-spacing:.04em}}

/* règle retirée : le titre redevient visible, gravé comme sur le site */

.idle h1 .b2{font-family:'Great Vibes','Playfair Display',cursive;font-weight:400;font-size:clamp(56px,20vw,132px);line-height:1;padding:.02em .2em .18em;margin-top:-.18em;color:transparent;-webkit-text-fill-color:transparent;background:linear-gradient(105deg,transparent 40%,#fffbe6cc 50%,transparent 60%) -150% 0/250% 100% no-repeat,linear-gradient(180deg,#ffe9a0 0%,var(--gold) 48%,#8a5a00 100%);-webkit-background-clip:text;background-clip:text;animation:b2In 1s .45s cubic-bezier(.2,.9,.3,1) both,goldShine 6s ease-in-out 2s infinite}
@keyframes b1In{0%{opacity:0;transform:translateY(14px) scale(.94);filter:blur(10px)}100%{opacity:1;transform:none;filter:blur(0)}}
@keyframes b2In{0%{opacity:0;transform:translateY(14px) scale(.94);filter:blur(10px)}100%{opacity:1;transform:none;filter:blur(0)}}
@keyframes lineIn{from{opacity:0;width:0}to{opacity:1}}
@keyframes goldShine{0%,55%{background-position:-150% 0,0 0}100%{background-position:250% 0,0 0}}
.idle .lgw{animation:cardIn .8s cubic-bezier(.2,.9,.3,1) both}
.idle p.f{animation:cardIn .8s .35s cubic-bezier(.2,.9,.3,1) both}
.idle .row .btn{animation:cardIn .7s .55s cubic-bezier(.2,.9,.3,1) both}
.idle .row .btn+.btn{animation-delay:.7s}
.btn,.card,.chip,.si,.op,.lg{transition:transform .18s cubic-bezier(.2,.9,.3,1),box-shadow .25s,border-color .2s,background-color .2s}
.btn:active,.chip:active,.si:active,.op:active,.lg:active{transform:scale(.95)}
.card:active{transform:scale(.97)}

.grid{scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.grid.in>.card{animation:cardIn .5s cubic-bezier(.2,.9,.3,1) both}
.grid.in>.card:nth-child(2){animation-delay:.05s}.grid.in>.card:nth-child(3){animation-delay:.1s}.grid.in>.card:nth-child(4){animation-delay:.15s}.grid.in>.card:nth-child(5){animation-delay:.2s}.grid.in>.card:nth-child(6){animation-delay:.25s}.grid.in>.card:nth-child(n+7){animation-delay:.3s}

.opi{transition:transform .25s cubic-bezier(.2,.9,.3,1)}.op:active .opi{transform:scale(.94)}

/* un cran plus grand sur un écran de borne */
.idle h1{font-size:clamp(34px,5.6vw,46px)}

/* ====== Photos plus vivantes ====== */
/* arrivée en cascade des choix (crudités, sauces, suppléments, boissons) */
.op{animation:opIn .42s cubic-bezier(.2,.9,.3,1) both;animation-delay:calc(var(--oi,0)*28ms)}
@keyframes opIn{from{opacity:0;transform:translateY(14px) scale(.94)}to{opacity:1;transform:none}}
.op .opi img{transition:transform .5s cubic-bezier(.2,.9,.3,1),filter .4s}
.op:active{transform:scale(.95)}
.op:active .opi img{transform:scale(1.12)}
.op.on .opi img{transform:scale(1.08);filter:saturate(1.12) brightness(1.04)}
.op.on{box-shadow:0 8px 22px #d4af3755,0 0 0 2px var(--gold)}
/* un éclat doré traverse la photo choisie */
.op.on .opi::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 42%,#fffbe8b3 50%,transparent 58%) -150% 0/260% 100% no-repeat;
  animation:opSh 1.1s ease-out}
@keyframes opSh{to{background-position:250% 0}}
/* photos des plats : léger zoom lent, et zoom net au toucher */
.card .ph,.card img,.tile img{transition:transform .55s cubic-bezier(.2,.9,.3,1)}
.card:active img,.tile:active img{transform:scale(1.07)}

@keyframes cardUp{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){
 .op,.ct .card{animation:none}
 .op .opi img,.card img,.tile img{transition:none}
 .op.on .opi::after{animation:none;display:none}}

/* ====== Accueil : plaque bordeaux du médaillon « Halal Food » derrière le titre ====== */
body .idle h1{font-size:clamp(38px,6.4vw,52px);
 background:radial-gradient(125% 150% at 50% 14%,#9a2a3c 0%,#7a1b2c 34%,#5a1020 66%,#3a0814 100%) padding-box!important;
 -webkit-background-clip:padding-box!important;background-clip:padding-box!important;
 box-shadow:inset 0 .09em .22em #000c,inset 0 -.04em .1em #ffb4b42e,0 0 0 .03em #f3d27a55!important}
/* ====== Menus : même logo qu'à l'accueil ====== */
.tlg .lgs.hfm{height:clamp(66px,10vh,104px);width:auto;border-radius:0;animation:pop .8s var(--e) backwards;
 filter:drop-shadow(0 2px 8px #000a) drop-shadow(0 0 12px #d4af3755)}

/* ====== Pas de flash quand on coche un choix ======
   La fenêtre est redessinée à chaque toucher : on ne rejoue les
   animations d'entrée qu'à l'ouverture, pas à chaque sélection. */
.mod.re,.mod.re .box,.mod.re .op{animation:none!important}
.mod.re .op.on .opi::after{animation:none!important;opacity:0}
.mod.re .op.on.nw .opi::after{opacity:1;animation:opSh 1.1s ease-out!important}
.mod.re .op.nw{animation:opTap .28s cubic-bezier(.2,.9,.3,1.4)!important}
@keyframes opTap{0%{transform:scale(.94)}100%{transform:none}}
.mod.re .op .opi img{transition:none}
.mod.re .op.on .opi img{transform:scale(1.08)}
.mod.re .op.nw.on .opi img{animation:opZ .35s ease-out}
@keyframes opZ{from{transform:scale(1)}to{transform:scale(1.08)}}
@media(prefers-reduced-motion:reduce){.mod.re .op.nw,.mod.re .op.nw.on .opi img,.mod.re .op.on.nw .opi::after{animation:none!important}}

/* changement d'étape : les nouveaux choix arrivent en cascade, sans rejouer la fenêtre */


/* ====== Fenêtre de personnalisation, taille borne ======
   Photos plus grandes, étapes en barre segmentée, boutons de pied larges. */
#m .box{width:min(94vw,880px);max-width:none!important}
#m .box h3{font-size:clamp(24px,3vw,32px);line-height:1.15}
#m .box .note{font-size:16px}
#m .box .dsc{font-size:clamp(15px,1.7vw,18px);line-height:1.45;margin:6px 0 4px}
#m .mh .btn.x{width:56px;height:56px;min-height:0;border-radius:50%;padding:0;font-size:22px;display:grid;place-items:center;border:2px solid #e6c35c;background:#fff;flex:none}
#m .stp{display:grid!important;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;padding:6px;margin:16px 0 4px;background:#f5ecd6;border-radius:18px;overflow:visible}
#m .stp>button{margin:0!important;justify-content:center;padding:10px 6px!important;min-height:60px;border-radius:13px;border:0!important;background:transparent;font-size:clamp(14px,1.8vw,18px);font-weight:700;color:#6b5a2e;gap:8px;white-space:nowrap}
#m .stp>button span{display:inline!important}
#m .stp>button i{width:30px;height:30px;font-size:15px;flex:none}

function sha256(str) {
  const K = [], H = [], fr = x => ((x - Math.floor(x)) * 4294967296) | 0;
  for (let n = 2, i = 0; i < 64; n++) {
    let pr = true;
    for (let d = 2; d * d <= n; d++) if (n % d === 0) { pr = false; break; }
    if (pr) { if (i < 8) H[i] = fr(Math.pow(n, .5)); K[i++] = fr(Math.pow(n, 1 / 3)); }
  }
  const b = [...new TextEncoder().encode(str)], l = b.length * 8, r = (x, n) => (x >>> n) | (x << (32 - n)), w = [];
  b.push(128);
  while (b.length % 64 !== 56) b.push(0);
  for (let j = 7; j >= 0; j--) b.push(j > 3 ? 0 : (l >>> (j * 8)) & 255);
  for (let o = 0; o < b.length; o += 64) {
    for (let j = 0; j < 16; j++) w[j] = (b[o + j * 4] << 24) | (b[o + j * 4 + 1] << 16) | (b[o + j * 4 + 2] << 8) | b[o + j * 4 + 3];
    for (let j = 16; j < 64; j++) {
      const x = w[j - 15], y = w[j - 2];
      w[j] = (w[j - 16] + (r(x, 7) ^ r(x, 18) ^ (x >>> 3)) + w[j - 7] + (r(y, 17) ^ r(y, 19) ^ (y >>> 10))) | 0;
    }
    let [a, c, d, e, f, g, h, k] = H;
    for (let j = 0; j < 64; j++) {
      const t1 = (k + (r(f, 6) ^ r(f, 11) ^ r(f, 25)) + ((f & g) ^ (~f & h)) + K[j] + w[j]) | 0;
      const t2 = ((r(a, 2) ^ r(a, 13) ^ r(a, 22)) + ((a & c) ^ (a & d) ^ (c & d))) | 0;
      k = h; h = g; g = f; f = (e + t1) | 0; e = d; d = c; c = a; a = (t1 + t2) | 0;
    }
    [a, c, d, e, f, g, h, k].forEach((v, j) => H[j] = (H[j] + v) | 0);
  }
  return H.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
}

const BLE_SVC=['000018f0-0000-1000-8000-00805f9b34fb','49535343-fe7d-4ae5-8fa9-9fafd205e455','e7810a71-73ae-499d-8c15-faa9aef0c3f2','0000ffe0-0000-1000-8000-00805f9b34fb','0000ff00-0000-1000-8000-00805f9b34fb','0000fee7-0000-1000-8000-00805f9b34fb'];
const CP={'é':0x82,'è':0x8A,'ê':0x88,'ë':0x89,'à':0x85,'â':0x83,'ä':0x84,'ç':0x87,'ô':0x93,'ö':0x94,'û':0x96,'ù':0x97,'ü':0x81,'ï':0x8B,'î':0x8C,'É':0x90,'À':0xB7,'Ç':0x80,'€':0xD5,'°':0xF8,'’':0x27,'×':0x78,'·':0x2D,'−':0x2D};

function receiptBytes(o){const P=S.printer,W=P.width==='58'?32:48,out=[];
 const E=t=>{for(const ch of String(t)){const c=ch.charCodeAt(0);out.push(c<128?c:(CP[ch]!==undefined?CP[ch]:63))}},L=(t='')=>{E(t);out.push(10)},cmd=(...x)=>out.push(...x);
 const row=(l,r)=>L(l.slice(0,W-r.length-1)+' '.repeat(Math.max(1,W-l.length-r.length))+r),wr=t=>{for(let k=0;k<t.length;k+=W-3)L('   '+t.slice(k,k+W-3))};
 cmd(0x1B,0x40,0x1B,0x74,19,0x1B,0x61,1);const C=CO();if(C.logo&&LOGOB&&LOGOB.d){cmd(0x1D,0x76,0x30,0,(LOGOB.w/8)&255,(LOGOB.w/8)>>8,LOGOB.h&255,LOGOB.h>>8);LOGOB.d.forEach(v=>out.push(v));L('')}cmd(0x1D,0x21,0x11,0x1B,0x45,1);L(C.name||S.shop);cmd(0x1D,0x21,0,0x1B,0x45,0);[C.addr,C.tel&&('Tel '+C.tel),C.web,C.tva&&('TVA '+C.tva),C.hours].filter(Boolean).forEach(x=>{for(let k=0;k<x.length;k+=W)L(x.slice(k,k+W))});L(o.ts);L('');
 cmd(0x1D,0x21,0x11,0x1B,0x45,1);L('N° '+o.n);cmd(0x1D,0x21,0,0x1B,0x45,0);L(o.mode+' · '+MN[o.m]);cmd(0x1B,0x61,0);L('-'.repeat(W));
 o.lines.forEach(l=>{row(l.q+'x '+l.n,eur(l.p*l.q));(l.d||[]).forEach(wr)});
 L('-'.repeat(W));cmd(0x1B,0x45,1);row('TOTAL',eur(o.total));cmd(0x1B,0x45,0);L(o.paid?'PAYE':'A PAYER A LA CAISSE');
 cmd(0x1B,0x61,1);L('');L(P.footer||'');cmd(0x1B,0x61,0);L('');L('');L('');
 if(P.drawer&&o.m==='cash')cmd(0x1B,0x70,0,25,250);cmd(0x1D,0x56,0x42,0);return new Uint8Array(out)}
async function usbSend(b){let d=prUSB||(await navigator.usb.getDevices())[0];if(!d)throw Error('Aucune imprimante USB associée.');prUSB=d;
 await d.open();try{if(!d.configuration)await d.selectConfiguration(1);let ifc,ep;
  for(const pass of [1,0])for(const i of d.configuration.interfaces)for(const a of i.alternates){const e=a.endpoints.find(e=>e.direction==='out'&&e.type==='bulk');if(e&&!ep&&(!pass||a.interfaceClass===7)){ifc=i;ep=e}}
  if(!ep)throw Error('Sortie USB introuvable.');await d.claimInterface(ifc.interfaceNumber);await d.transferOut(ep.endpointNumber,b);await d.releaseInterface(ifc.interfaceNumber)}finally{try{await d.close()}catch(e){}}}
async function serSend(b){const p=prSER||(await navigator.serial.getPorts())[0];if(!p)throw Error('Aucun port série associé.');prSER=p;
 await p.open({baudRate:+S.printer.baud||9600});try{const w=p.writable.getWriter();await w.write(b);w.releaseLock()}finally{try{await p.close()}catch(e){}}}
async function bleSend(b){if(!prBLE)throw Error('Associez de nouveau l’imprimante Bluetooth (session expirée).');
 const srv=await prBLE.gatt.connect();let ch=null;for(const sv of await srv.getPrimaryServices()){for(const c of await sv.getCharacteristics())if(c.properties.write||c.properties.writeWithoutResponse){ch=c;break}if(ch)break}
 if(!ch)throw Error('Canal d’écriture introuvable sur cet appareil.');
 for(let i=0;i<b.length;i+=100){const q=b.slice(i,i+100);if(ch.properties.writeWithoutResponse)await ch.writeValueWithoutResponse(q);else await ch.writeValue(q);await new Promise(r=>setTimeout(r,25))}}
async function printOrder(o){const m=S.printer.mode;try{
 if(m==='nav'){kGrace=Date.now()+60000;window.print();kGrace=Date.now()+5000;needFS=true;setTimeout(goFS,150);return'ok'}
 await prepLogo();const b=receiptBytes(o);
 if(m==='usb')await usbSend(b);else if(m==='ser')await serSend(b);else if(m==='ble')await bleSend(b);
 else if(m==='net'){if(!S.printer.url)throw Error('Adresse de la passerelle manquante.');await fetch(S.printer.url,{method:'POST',body:b,mode:'no-cors',headers:{'Content-Type':'application/octet-stream'}})}
 return'ok'}catch(e){return e.message||String(e)}}

async function prPair(){const P=S.printer,m=P.mode;kGrace=Date.now()+60000;try{

function changePin(){const g=i=>$('#'+i).value,m=t=>$('#pn_msg').textContent=t;
